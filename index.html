<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: http://127.0.0.1:1984 http://localhost:1984; connect-src 'self' http://127.0.0.1:1984 http://localhost:1984 ws://127.0.0.1:5173 ws://localhost:5173 ws://127.0.0.1:1984 ws://localhost:1984;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CamPanel</title>
    <style>
      :root {
        background: #06090e;
        color: #f0f6fc;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background-color: #06090e;
        overflow: hidden;
      }

      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #06090e;
        color: #f0f6fc;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .boot-spinner {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #00f2fe;
        border-right-color: #2dd4bf;
        animation: boot-spin 900ms linear infinite;
        box-shadow: 0 0 24px rgba(0, 242, 254, 0.3);
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-screen" class="boot-screen" role="status" aria-live="polite">
      <div class="boot-spinner"></div>
      <span>Iniciando CamPanel...</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
