<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: http://127.0.0.1:1984 http://localhost:1984; connect-src 'self' http://127.0.0.1:1984 http://localhost:1984 ws://127.0.0.1:5173 ws://localhost:5173 ws://127.0.0.1:1984 ws://localhost:1984;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CamPanel</title>
    <style>
      :root {
        background: #0b1018;
        color: #eef4ff;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(45, 212, 191, 0.12), transparent 30rem),
          linear-gradient(135deg, #0b1018 0%, #101826 50%, #081018 100%);
      }

      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 16px;
        background: #0b1018;
        color: #dbe7f7;
        font-size: 0.95rem;
      }

      .boot-spinner {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 4px solid rgba(154, 174, 205, 0.22);
        border-top-color: #2dd4bf;
        animation: boot-spin 850ms linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-screen" class="boot-screen" role="status" aria-live="polite">
      <div class="boot-spinner"></div>
      <span>Carregando cameras...</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
